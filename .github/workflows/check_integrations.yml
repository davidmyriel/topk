name: Check integrations

# Verifies that the third-party integrations described in docs/integrations
# (listing pages, PyPI packages, GitHub repos, external links) still exist.
# Scheduled runs open or update an issue when a claim stops holding.

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays, 09:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/integrations/**"
      - "utils/integrations.json"
      - "utils/check-integrations.ts"
      - ".github/workflows/check_integrations.yml"

permissions:
  contents: read

jobs:
  check:
    name: Integration claims
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install bun dependencies
        run: bun add commander

      - name: Check integrations
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run utils/check-integrations.ts --report integrations-report.md

      - name: Write job summary
        if: always()
        run: cat integrations-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Open or update issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Integration listings out of date"
        run: |
          {
            cat integrations-report.md
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > issue-body.md
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body-file issue-body.md
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file issue-body.md
          fi
