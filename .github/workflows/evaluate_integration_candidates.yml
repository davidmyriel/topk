name: Evaluate integration candidates

# Scores each project in utils/integration-candidates.json on fit, popularity,
# mergeability and docs access (see utils/INTEGRATIONS.md) and writes the
# scorecard to the job summary.

on:
  schedule:
    - cron: "43 10 1 * *" # 1st of each month, 10:43 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Evaluate only candidates whose name contains this text"
        required: false
  pull_request:
    paths:
      - "utils/integration-candidates.json"
      - "utils/evaluate-integration-candidates.ts"
      - ".github/workflows/evaluate_integration_candidates.yml"

permissions:
  contents: read

jobs:
  evaluate:
    name: Integration candidates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install bun dependencies
        run: bun add commander

      - name: Evaluate candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY: ${{ inputs.only }}
        run: bun run utils/evaluate-integration-candidates.ts --report candidates-report.md ${ONLY:+--only "$ONLY"}

      - name: Write job summary
        if: always()
        run: cat candidates-report.md >> "$GITHUB_STEP_SUMMARY" || true
